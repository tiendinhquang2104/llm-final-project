# Task 1 gold-only QLoRA by default; silver→gold comparison remains optional.
model: Qwen/Qwen2.5-Coder-7B-Instruct
seed: 42
data:
  processed_dir: data/processed
  splits_dir: data/splits
  expected_train: 26
  expected_val: 6
output_dir: outputs/task1/qwen25_coder7b_qlora_gold
training:
  max_length: 4096
  epochs: 3
  silver_epochs: 1
  batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.0001
  silver_learning_rate: 0.00005
  warmup_ratio: 0.1
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
generation:
  max_new_tokens: 256
