prompt:
  few_shot_k: 3
  demo_max_code_chars: 1800
demos:
  gold: true            # 32 bài gold (bài đang chấm không bao giờ là demo của chính nó)
  silver: true          # data/synth/v1 (tải theo SILVER_DRIVE_ID nếu chưa có)
  min_gold_sim: 0.3
