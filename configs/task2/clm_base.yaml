extends: base.yaml
name: task2_clm
description: Hướng 2 — CLM-8B (Qwen3-8B frozen + head), câu hỏi noul cho từng nhãn; probe tuyến tính làm ablation.
text:
  max_tokens: 2048            # CLM reference encoder length
  max_statement_tokens: 512
train:
  epochs: 15
  lr: 1.0e-5
  weight_decay: 0.01
  batch_size: 32
  pos_weight_max: 10.0
  train_action_head: true
probe:
  C: 1.0
thresholds:
  default: 0.5
  min_rate: 0.02              # each label predicted for >= 2% of public samples
silver:
  path: null                  # silver_labels.json from scripts/run_task2_api.py (predict mode)
  holdout: 0.1                # share of silver samples kept for threshold tuning
final_system: clm_noul
cache_dir: outputs/task2/_emb_cache
