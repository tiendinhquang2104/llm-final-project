extends: base.yaml
name: task2_clm
description: Hướng 2 — CLM-8B (Qwen3-8B frozen + head), câu hỏi noul cho từng nhãn; context có compile_log tự compile, probe có thêm cột has_compile_error, biến thể +cr gán Lỗi biên dịch theo log; train trên 32 bài gold + mẫu chèn lỗi, đánh giá k-fold.
text:
  max_tokens: 2048            # CLM reference encoder length
  max_statement_tokens: 512
  use_compile_log: true       # self-compiled g++ output between statement and code
  max_compile_tokens: 256
train:
  epochs: 15
  lr: 1.0e-5                  # used when lr_grid is absent
  lr_grid: [1.0e-5, 1.0e-4, 1.0e-3]   # lr chosen per CLM system on gold OOF macro-F1 @tuned (ties -> smaller)
  weight_decay: 0.01
  batch_size: 32
  pos_weight_max: 10.0
  train_action_head: true
probe:
  C: 1.0
  compile_feature: true       # probe input = [embedding, has_compile_error]
thresholds:
  default: 0.5
  min_rate: 0.02              # each label predicted for >= 2% of public samples
cv:
  folds: 4                    # k-fold over the 32 gold samples (out-of-fold metrics + thresholds)
augment:
  rules: true                 # src/task2/augment.py bug injection on gold code (never test inputs)
  max_per_mutator: null       # null = every applicable gold sample
  api_path: null              # optional mutants.json from scripts/augment_task2_api.py
final_system: probe_aug       # best on gold OOF (macro-F1 @0.5 and @tuned); never chosen on public outputs
cache_dir: outputs/task2/_emb_cache
task1:
  alphas: [0.1, 1.0, 10.0, 100.0]   # ridge strength, chosen by out-of-fold QWK on the 32 gold samples
  compile_gate: true                 # Task 1 rule: compilable=0 zeroes the policy's dimensions
