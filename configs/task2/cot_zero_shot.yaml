extends: base.yaml
name: task2_cot_zero_shot
description: Zero-shot chain-of-thought, vai giảng viên, 9 bước chấm rồi dòng KẾT LUẬN; có compile_log tự compile; Lỗi biên dịch lấy từ compile_log; không demo, không test_report.
prompt:
  style: cot
  lang: vi              # ngôn ngữ của prompt (persona, quy tắc, các bước): vi | en; đề + code giữ nguyên, nhãn luôn tiếng Việt
  few_shot_k: 0
  max_code_chars: 12000
  use_aux_signals: true
  strip_comments: true   # bỏ code trong comment (giữ số dòng) trước khi đưa vào prompt
  compile_rule: true     # "Lỗi biên dịch" := compile_log có lỗi compiler (warning / thiếu main không tính), thay cho phiếu của model
  max_prompt_chars: 24000  # ~8k token; prompt dài hơn thì bỏ bớt demo (T4: OOM với prompt dài)
generation:
  temperature: 0.0     # zero-shot greedy; self-consistency = cot_self_consistency.yaml
  max_new_tokens: 1024
  enable_thinking: false
  n: 1
retry_on_parse_fail: 1
checkpoint_every: 4
