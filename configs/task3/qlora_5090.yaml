extends: qlora.yaml
experiment: mixed_balanced
output_dir: checkpoints/task3/qlora_5090
max_seq_length: auto
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 4
source_weights:
  real: 0.5
  synthetic: 0.5
lr_scheduler_type: cosine
warmup_ratio: 0.03
eval_strategy: steps
eval_steps: 20
save_strategy: steps
save_steps: 20
save_total_limit: 2
load_best_model_at_end: true
single_gpu: true
report_to: []
