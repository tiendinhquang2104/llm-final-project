# 6 more multi_problem exams (array/struct CSV style) to reach 10 train multi exams.
problems_meta:
  - exam_id: SYN-SUMB
    exam_type: multi_problem
    title: Tổng cột b
    language: cpp11
    statement: |
      Cho file sb.csv mỗi dòng hai số a b. P1 đọc bản ghi vào mảng động (tiên quyết).
      P2 tổng các giá trị b. P3 max a. P4 in tổng b.
    problems:
      - {pid: P1, max_score: 2.5, prototype: "Rec* prob1(string filename, int& n);", is_prerequisite_for: [P2, P3, P4]}
      - {pid: P2, max_score: 2.5, prototype: "int prob2(Rec* arr, int n);"}
      - {pid: P3, max_score: 2.5, prototype: "int prob3(Rec* arr, int n);"}
      - {pid: P4, max_score: 2.5, prototype: "void prob4(Rec* arr, int n);"}
    data_files:
      sb.csv: "1 2\n3 4\n5 6\n"
    reference: |
      #include <iostream>
      #include <fstream>
      using namespace std;
      struct Rec { int a, b; };
      Rec* prob1(string filename, int& n) {
          ifstream f(filename);
          Rec* arr = new Rec[100];
          n = 0;
          while (f >> arr[n].a >> arr[n].b) { n = n + 1; }
          return arr;
      }
      int prob2(Rec* arr, int n) {
          int s = 0;
          for (int i = 0; i < n; i++) { s = s + arr[i].b; }
          return s;
      }
      int prob3(Rec* arr, int n) {
          int m = arr[0].a;
          for (int i = 1; i < n; i++) { if (arr[i].a > m) m = arr[i].a; }
          return m;
      }
      void prob4(Rec* arr, int n) { cout << prob2(arr, n); }
    harness: |
      int main() {
          int n = 0;
          Rec* a = prob1("sb.csv", n);
          int s = prob2(a, n);
          int m = prob3(a, n);
          prob4(a, n);
          cout << "\nP1=" << (n == 3 ? "ok" : "fail")
               << " P2=" << (s == 12 ? "ok" : "fail")
               << " P3=" << (m == 5 ? "ok" : "fail")
               << " P4=" << (s == 12 ? "ok" : "fail") << "\n";
          return 0;
      }
    metadata:
      targets:
        - {defect: CLEAN, states: [ok, ok, ok, ok], total: 10, level: "Level 1 - Gợi ý nhẹ"}
        - {defect: D01, level: "Level 2 - Chẩn đoán"}
        - {defect: D04, level: "Level 2 - Chẩn đoán"}
        - {defect: D15, level: "Level 2 - Chẩn đoán"}

