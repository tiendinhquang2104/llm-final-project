  - exam_id: SYN-MAXDIFF
    exam_type: multi_problem
    title: Hiệu lớn nhất
    language: cpp11
    statement: |
      Cho file md.csv mỗi dòng hai số a b. P1 đọc bản ghi (tiên quyết).
      P2 tổng a-b. P3 hiệu a-b lớn nhất. P4 in tổng a-b.
    problems:
      - {pid: P1, max_score: 2.5, prototype: "Rec* prob1(string filename, int& n);", is_prerequisite_for: [P2, P3, P4]}
      - {pid: P2, max_score: 2.5, prototype: "int prob2(Rec* arr, int n);"}
      - {pid: P3, max_score: 2.5, prototype: "int prob3(Rec* arr, int n);"}
      - {pid: P4, max_score: 2.5, prototype: "void prob4(Rec* arr, int n);"}
    data_files:
      md.csv: "9 1\n3 3\n5 2\n"
    reference: |
      #include <iostream>
      #include <fstream>
      using namespace std;
      struct Rec { int a, b; };
      Rec* prob1(string filename, int& n) {
          ifstream f(filename);
          Rec* arr = new Rec[100];
          n = 0;
          while (f >> arr[n].a >> arr[n].b) { n = n + 1; }
          return arr;
      }
      int prob2(Rec* arr, int n) {
          int s = 0;
          for (int i = 0; i < n; i++) { s = s + (arr[i].a - arr[i].b); }
          return s;
      }
      int prob3(Rec* arr, int n) {
          int m = arr[0].a - arr[0].b;
          for (int i = 1; i < n; i++) { if (arr[i].a - arr[i].b > m) m = arr[i].a - arr[i].b; }
          return m;
      }
      void prob4(Rec* arr, int n) { cout << prob2(arr, n); }
    harness: |
      int main() {
          int n = 0;
          Rec* a = prob1("md.csv", n);
          int s = prob2(a, n);
          int m = prob3(a, n);
          prob4(a, n);
