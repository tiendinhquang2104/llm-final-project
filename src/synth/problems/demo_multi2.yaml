    title: Held-out multi 1 (đếm cột a chẵn)
    language: cpp11
    heldout: true
    statement: |
      Cho file ho1.csv mỗi dòng hai số a b.
      P1: đọc bản ghi vào mảng động (tiên quyết). P2: đếm a chẵn. P3: max b. P4: in số a chẵn.
    problems:
      - {pid: P1, max_score: 2.5, prototype: "Rec* prob1(string filename, int& n);", is_prerequisite_for: [P2, P3, P4]}
      - {pid: P2, max_score: 2.5, prototype: "int prob2(Rec* arr, int n);"}
      - {pid: P3, max_score: 2.5, prototype: "int prob3(Rec* arr, int n);"}
      - {pid: P4, max_score: 2.5, prototype: "void prob4(Rec* arr, int n);"}
    data_files:
      ho1.csv: "2 5\n3 8\n4 1\n"
    reference: |
      #include <iostream>
      #include <fstream>
      using namespace std;
      struct Rec { int a, b; };
      Rec* prob1(string filename, int& n) {
          ifstream f(filename);
          Rec* arr = new Rec[100];
          n = 0;
          while (f >> arr[n].a >> arr[n].b) { n = n + 1; }
          return arr;
      }
      int prob2(Rec* arr, int n) {
          int c = 0;
          for (int i = 0; i < n; i++) { if (arr[i].a % 2 == 0) c = c + 1; }
          return c;
      }
      int prob3(Rec* arr, int n) {
          int m = arr[0].b;
          for (int i = 1; i < n; i++) { if (arr[i].b > m) m = arr[i].b; }
          return m;
      }
      void prob4(Rec* arr, int n) { cout << prob2(arr, n); }
    harness: |
      int main() {
          int n = 0;
          Rec* a = prob1("ho1.csv", n);
          int c = prob2(a, n);
          int m = prob3(a, n);
          prob4(a, n);
          cout << "\nP1=" << (n == 3 ? "ok" : "fail")
               << " P2=" << (c == 2 ? "ok" : "fail")
               << " P3=" << (m == 8 ? "ok" : "fail")
               << " P4=" << (c == 2 ? "ok" : "fail") << "\n";
          return 0;
      }
