# Demo problem bank (schemas match sample_dataset/exams.json). Extend with the full 28-exam bank.
# Tests are hand-written and used only to LABEL and to feed the oracle; they never enter training.
problems_meta:
  - exam_id: SYN-ARM
    exam_type: single_problem
    title: Kiểm tra số Armstrong
    language: cpp11
    statement: |
      Một số Armstrong là số n có d chữ số thoả n = a_1^d + a_2^d + ... + a_d^d,
      với a_i là chữ số thứ i của n (luỹ thừa bậc d = số chữ số của n, KHÔNG phải luôn là bậc 3).
      Ví dụ 1634 có 4 chữ số và 1^4 + 6^4 + 3^4 + 4^4 = 1634 nên là số Armstrong.

      Input: một số nguyên n (1 <= n <= 10^9).
      Output: in "True" nếu n là số Armstrong, ngược lại in "False".

      | Input | Output |
      |---|---|
      | 1634 | True |
      | 123 | False |

      Lưu ý: không được dùng hàm pow.
    problems:
      - pid: P1
        max_score: 10
        io_mode: stdin/stdout
        constraints: "1 <= n <= 10^9; không được dùng pow"
    tests:
      - {input: "153", expected: "True", group: "normal"}
      - {input: "1634", expected: "True", group: "normal"}
      - {input: "9474", expected: "True", group: "normal"}
      - {input: "548834", expected: "True", group: "normal"}
      - {input: "123", expected: "False", group: "normal"}
      - {input: "9475", expected: "False", group: "normal"}
      - {input: "1000", expected: "False", group: "normal"}
      - {input: "1634", expected: "True", group: "example"}
      - {input: "123", expected: "False", group: "example"}
      - {input: "1", expected: "True", group: "edge:min"}
      - {input: "9", expected: "True", group: "edge:min"}
      - {input: "10", expected: "False", group: "edge:zero_digit"}
      - {input: "370", expected: "True", group: "edge:zero_digit"}
      - {input: "407", expected: "True", group: "edge:zero_digit"}
      - {input: "912985153", expected: "True", group: "edge:max"}
      - {input: "999999999", expected: "False", group: "edge:max"}
      - {input: "999999999", expected: "False", group: "perf"}
    reference: |
      #include <iostream>
      using namespace std;
      int countDigits(int n) {
          int d = 0;
          while (n > 0) {
              d = d + 1;
              n = n / 10;
          }
          return d;
      }
      bool isArm(int n) {
          int d = countDigits(n);
          long long sum = 0;
          int tmp = n;
          while (tmp > 0) {
              int digit = tmp % 10;
              long long p = 1;
              for (int i = 0; i < d; i++) {
                  p = p * digit;
              }
              sum = sum + p;
              tmp = tmp / 10;
          }
          return sum == n;
      }
      int main() {
          int n;
          cin >> n;
          cout << (isArm(n) ? "True" : "False");
          return 0;
      }
    metadata:
      targets:
        - {defect: CLEAN, level: "Level 1 - Gợi ý nhẹ", pair_id: pair-io}
        - {defect: D00, level: "Level 2 - Chẩn đoán"}
        - {defect: D01, level: "Level 2 - Chẩn đoán"}
        - {defect: D02, level: "Level 2 - Chẩn đoán"}
        - {defect: D07, level: "Level 3 - Gợi ý sửa", pair_id: pair-io}
        - {defect: D19, level: "Level 2 - Chẩn đoán"}
        - {defect: D23, level: "Level 3 - Gợi ý sửa", trap: "garbage_names"}

  - exam_id: SYN-GEN
    exam_type: multi_problem
    title: Xử lý bản ghi (P1 tiên quyết)
    language: cpp11
    statement: |
      Cho file records.csv mỗi dòng gồm hai số a b.
      P1: đọc toàn bộ bản ghi vào mảng cấp phát động, trả về con trỏ, gán n = số dòng.
      P2: tính tổng các giá trị a.
      P3: tìm giá trị a lớn nhất.
      P4: in kết quả P2.
      Nếu P1 không đọc được file thì các câu sau không được chấm.
    problems:
      - {pid: P1, max_score: 2.5, prototype: "Rec* prob1(string filename, int& n);", is_prerequisite_for: [P2, P3, P4]}
      - {pid: P2, max_score: 2.5, prototype: "int prob2(Rec* arr, int n);"}
      - {pid: P3, max_score: 2.5, prototype: "int prob3(Rec* arr, int n);"}
      - {pid: P4, max_score: 2.5, prototype: "void prob4(Rec* arr, int n);"}
    data_files:
      records.csv: |
        1 2
        3 4
        5 6
    reference: |
      #include <iostream>
      #include <fstream>
      using namespace std;
      struct Rec { int a, b; };
      Rec* prob1(string filename, int& n) {
          ifstream f(filename);
          Rec* arr = new Rec[100];
          n = 0;
          while (f >> arr[n].a >> arr[n].b) { n = n + 1; }
          return arr;
      }
      int prob2(Rec* arr, int n) {
          int s = 0;
          for (int i = 0; i < n; i++) { s += arr[i].a; }
          return s;
      }
      int prob3(Rec* arr, int n) {
          int m = arr[0].a;
          for (int i = 0; i < n; i++) { if (arr[i].a > m) m = arr[i].a; }
          return m;
      }
      void prob4(Rec* arr, int n) { cout << prob2(arr, n); }
    harness: |
      int main() {
          int n = 0;
          Rec* a = prob1("records.csv", n);
          int s = prob2(a, n);
          int m = prob3(a, n);
          prob4(a, n);
          cout << "\nP1=" << (n == 3 ? "ok" : "fail")
               << " P2=" << (s == 9 ? "ok" : "fail")
               << " P3=" << (m == 5 ? "ok" : "fail")
               << " P4=" << (s == 9 ? "ok" : "fail") << "\n";
          return 0;
      }
    metadata:
      targets:
        - {defect: CLEAN, states: [ok, ok, ok, ok], total: 10, level: "Level 1 - Gợi ý nhẹ"}
        - {defect: D01, level: "Level 2 - Chẩn đoán"}
        - {defect: D04, level: "Level 2 - Chẩn đoán"}
        - {defect: D15, level: "Level 2 - Chẩn đoán"}
        - {defect: D13, rule: M4, states: [ok, ok, partial, ok], total: 9, level: "Level 3 - Gợi ý sửa", mutate: false}
        - {defect: D14, rule: M4, states: [ok, ok, ok, edge], total: 9, level: "Level 3 - Gợi ý sửa", mutate: false}
        - {defect: D12, rule: M4, states: [ok, ok, ok, missing], total: 8, level: "Level 2 - Chẩn đoán", mutate: false}

  - exam_id: SYN-HELDOUT
    exam_type: single_problem
    title: Đếm ước chung lớn nhất (held-out, chỉ để đánh giá)
    language: cpp11
    heldout: true
    statement: |
      Đọc hai số nguyên không âm a, b (0 <= a, b <= 10^9, không đồng thời bằng 0).
      In ra ước chung lớn nhất của a và b.

      | Input | Output |
      |---|---|
      | 12 18 | 6 |
    problems:
      - {pid: P1, max_score: 10, io_mode: stdin/stdout, constraints: "0 <= a, b <= 10^9"}
    tests:
      - {input: "12 18", expected: "6", group: "normal"}
      - {input: "7 13", expected: "1", group: "normal"}
      - {input: "100 75", expected: "25", group: "normal"}
      - {input: "48 180", expected: "12", group: "normal"}
      - {input: "17 51", expected: "17", group: "normal"}
      - {input: "270 192", expected: "6", group: "normal"}
      - {input: "12 18", expected: "6", group: "example"}
      - {input: "0 5", expected: "5", group: "edge:zero"}
      - {input: "5 0", expected: "5", group: "edge:zero"}
      - {input: "9 9", expected: "9", group: "edge:equal"}
      - {input: "1 1", expected: "1", group: "edge:equal"}
      - {input: "1000000000 999999999", expected: "1", group: "edge:large"}
      - {input: "1000000000 500000000", expected: "500000000", group: "edge:large"}
      - {input: "1000000000 1", expected: "1", group: "perf"}
    reference: |
      #include <iostream>
      using namespace std;
      int gcd(int a, int b) { while (b) { int t = a % b; a = b; b = t; } return a; }
      int main() { int a, b; cin >> a >> b; cout << gcd(a, b); return 0; }
    metadata:
      targets:
        - {defect: CLEAN, level: "Level 1 - Gợi ý nhẹ"}
        - {defect: D07, level: "Level 3 - Gợi ý sửa"}
